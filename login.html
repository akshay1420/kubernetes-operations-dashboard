<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kubernetes Dashboard · Sign in</title><link rel="stylesheet" href="styles.css"><style>.login-page{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#1b496a 0,#0a1322 52%,#060b14 100%)}.login-card{display:block;min-height:0;width:min(430px,92vw);padding:42px;border-radius:18px;background:linear-gradient(145deg,#152844,#0d192c);border:1px solid #426a93;box-shadow:0 28px 80px #000a}.login-card h1{font-size:30px;margin:6px 0}.login-card p{color:#b2c1d5;line-height:1.55;margin:0 0 24px}.login-card label{display:block;margin:16px 0;color:#dce8f7}.login-card input{display:block;width:100%;margin-top:7px}.login-card button{width:100%;margin-top:10px;padding:11px;background:#0f907f;border-color:#51ddc5;font-weight:700}.login-card .error{min-height:20px;color:#ff8892;margin:8px 0}.brand{letter-spacing:1.7px;color:#55dfc6;font-size:11px;font-weight:700}</style></head><body class="login-page"><main class="login-card"><div class="brand">KUBERNETES DASHBOARD</div><h1>Welcome back</h1><p>Sign in to monitor workloads, review cluster health, and operate authorized resources.</p><form id="login"><label>Username<input id="username" required autocomplete="username" autofocus></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><p id="error" class="error"></p><button>Sign in</button></form></main><script src="login.js"></script></body></html>
