{{- if and .Values.history.enabled (ne (int .Values.replicaCount) 1) }}
{{- fail "File history requires replicaCount=1 (single writer)." }}
{{- end }}
{{- if and .Values.history.enabled (empty .Values.history.namespaces) }}
{{- fail "Set history.namespaces explicitly." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubernetes-operations-dashboard.fullname" . }}
  labels: { app.kubernetes.io/name: {{ include "kubernetes-operations-dashboard.name" . }} }
spec:
  {{- if .Values.history.enabled }}
  strategy: { type: Recreate }
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/name: {{ include "kubernetes-operations-dashboard.name" . }} } }
  template:
    metadata: { labels: { app.kubernetes.io/name: {{ include "kubernetes-operations-dashboard.name" . }} } }
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kubernetes-operations-dashboard.serviceAccountName" . }}
      securityContext: { runAsNonRoot: true, fsGroup: 10001 }
      {{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ include "kubernetes-operations-dashboard.name" . }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      volumes:
        {{- if .Values.history.enabled }}
        - name: history
          persistentVolumeClaim:
            claimName: {{ .Values.history.existingClaim | default (printf "%s-history" (include "kubernetes-operations-dashboard.fullname" .)) }}
        {{- end }}
        - name: runtime
          emptyDir: {}
        {{- if .Values.auth.enabled }}
        - name: auth
          secret:
            secretName: {{ include "kubernetes-operations-dashboard.authSecretName" . }}
        {{- end }}
      containers:
        - name: dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DASHBOARD_HISTORY_ENABLED
              value: {{ .Values.history.enabled | quote }}
            - name: DASHBOARD_HISTORY_NAMESPACES
              value: {{ join "," .Values.history.namespaces | quote }}
            - name: DASHBOARD_HISTORY_INTERVAL
              value: {{ .Values.history.intervalSeconds | quote }}
            - name: DASHBOARD_HISTORY_RETENTION
              value: {{ .Values.history.retentionDays | quote }}
            - name: DASHBOARD_HISTORY_MAX_BYTES
              value: {{ .Values.history.maxBytes | int64 | quote }}
            - name: DASHBOARD_HISTORY_LOGS
              value: {{ .Values.history.logsEnabled | quote }}
            - name: DASHBOARD_REFRESH_SECONDS
              value: {{ .Values.realtime.refreshSeconds | quote }}
            - name: DASHBOARD_NODE_CPU_WARNING
              value: {{ .Values.realtime.nodeCpuWarning | quote }}
            - name: DASHBOARD_NODE_MEMORY_WARNING
              value: {{ .Values.realtime.nodeMemoryWarning | quote }}
            - name: DASHBOARD_POD_RESTART_WARNING
              value: {{ .Values.realtime.podRestartWarning | quote }}
            - name: DASHBOARD_PENDING_WARNING_SECONDS
              value: {{ .Values.realtime.pendingPodWarningSeconds | quote }}
            - name: DASHBOARD_AUTH_REQUIRED
              value: {{ ternary "true" "false" .Values.auth.enabled | quote }}
            - name: DASHBOARD_SCALE_ENABLED
              value: {{ ternary "true" "false" .Values.actions.scale.enabled | quote }}
            - name: DASHBOARD_CRONJOB_SUSPEND_ENABLED
              value: {{ ternary "true" "false" .Values.actions.cronJobSuspend.enabled | quote }}
            - name: DASHBOARD_CRONJOB_EDIT_ENABLED
              value: {{ ternary "true" "false" .Values.actions.cronJobEdit.enabled | quote }}
            - name: DASHBOARD_HPA_EDIT_ENABLED
              value: {{ ternary "true" "false" .Values.actions.hpaEdit.enabled | quote }}
            {{- if .Values.auth.enabled }}
            - name: DASHBOARD_SESSION_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "kubernetes-operations-dashboard.authSecretName" . }}, key: session-secret } }
            {{- end }}
          volumeMounts:
            {{- if .Values.history.enabled }}
            - name: history
              mountPath: /data/history
            {{- end }}
            - name: runtime
              mountPath: /tmp
            {{- if .Values.auth.enabled }}
            - name: auth
              mountPath: /etc/kubernetes-dashboard-auth
              readOnly: true
            {{- end }}
          ports: [{ name: http, containerPort: 8787 }]
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 3 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 10 }
