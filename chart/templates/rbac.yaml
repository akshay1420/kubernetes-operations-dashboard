# Cluster-scope read access: nodes, namespace names, and node metrics only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: {{ include "kubernetes-operations-dashboard.fullname" . }}-cluster-read }
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: {{ include "kubernetes-operations-dashboard.fullname" . }}-cluster-read }
subjects:
  - kind: ServiceAccount
    name: {{ include "kubernetes-operations-dashboard.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "kubernetes-operations-dashboard.fullname" . }}-cluster-read }
---
# Binding this role per namespace prevents cross-environment workload actions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: {{ include "kubernetes-operations-dashboard.fullname" . }}-operator }
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "persistentvolumeclaims", "services", "resourcequotas", "limitranges"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
{{- if .Values.rbac.clusterWideActions }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: {{ include "kubernetes-operations-dashboard.fullname" . }}-operator-clusterwide }
subjects:
  - kind: ServiceAccount
    name: {{ include "kubernetes-operations-dashboard.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "kubernetes-operations-dashboard.fullname" . }}-operator }
{{- else }}
{{- range .Values.rbac.allowedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubernetes-operations-dashboard.fullname" $ }}-operator
  namespace: {{ . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubernetes-operations-dashboard.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "kubernetes-operations-dashboard.fullname" $ }}-operator }
{{- end }}
{{- end }}
