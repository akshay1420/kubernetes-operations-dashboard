{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $old := lookup "v1" "Secret" .Release.Namespace .Values.auth.secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.secretName }}
type: Opaque
data:
  users.json: {{ dict "users" .Values.auth.users | toJson | b64enc | quote }}
  session-secret: {{ if .Values.auth.sessionSecret }}{{ .Values.auth.sessionSecret | b64enc | quote }}{{ else if $old }}{{ index $old.data "session-secret" | quote }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}
{{- end }}
